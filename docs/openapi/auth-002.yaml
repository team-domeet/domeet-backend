openapi: 3.0.3
info:
  title: 두밋 소셜 로그인 API
  version: 0.1.0
  description: |
    이슈 #1에서 검토할 AUTH-002 계약 초안이다.
    현재 서버는 Google 토큰 검증과 회원 조회를 수행하고 미연결 Google 계정에
    가입 진입 응답을 반환한다. 세션 발급, 가입 재개 응답, 로그인 시도 발급과
    카카오·Apple 검증은 후속 구현 범위다.
    실제 인증 정보는 HTTPS로 전송한다.
paths:
  /api/v1/auth/social-login-attempts:
    post:
      operationId: createSocialLoginAttempt
      summary: 카카오·Apple 로그인 시도 시작
      description: |
        앱은 제공자 로그인 전에 서버에서 일회용 nonce를 받는다. 앱은 제공자
        SDK를 통해 nonce를 전달하고, 로그인 완료 요청에 attemptId를 포함한다.
        서버는 저장된 시도의 제공자, 만료 및 사용 여부를 확인하고, 토큰의
        nonce가 해당 SDK의 전달 방식에 따른 기대값과 일치하는지 검증한다.
        사용자가 소셜 인증을 취소하면 앱은 로그인 완료 요청을 보내지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider:
                  type: string
                  enum: [KAKAO, APPLE]
            example: {provider: APPLE}
      responses:
        '201':
          description: 로그인 시도 발급
          content:
            application/json:
              schema:
                type: object
                required: [attemptId, nonce, expiresIn]
                properties:
                  attemptId: {type: string, minLength: 1}
                  nonce: {type: string, minLength: 1}
                  expiresIn: {type: integer, minimum: 1, description: 로그인 시도 유효기간(초)}
              example: {attemptId: example-attempt, nonce: example-nonce, expiresIn: 300}
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/social-logins:
    post:
      operationId: socialLogin
      summary: 소셜 로그인 완료
      description: |
        서버가 소셜 인증을 검증한 후 제공자와 토큰의 sub로 연결된 회원을 찾는다.
        로그인 가능한 기존 회원에게 두밋 기기별 세션을 발급한다.
        미연결 계정에는 가입과 기존 계정 확인을 안내하고, 가입 미완료 회원은
        저장된 마지막 미완료 단계로 이동시킨다. 인증 정보와 가입용 토큰은
        로그에 남기지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/KakaoLogin'
                - $ref: '#/components/schemas/GoogleLogin'
                - $ref: '#/components/schemas/AppleLogin'
              discriminator:
                propertyName: provider
                mapping:
                  KAKAO: '#/components/schemas/KakaoLogin'
                  GOOGLE: '#/components/schemas/GoogleLogin'
                  APPLE: '#/components/schemas/AppleLogin'
            examples:
              kakao:
                value: {provider: KAKAO, idToken: example-kakao-token, attemptId: example-attempt}
              google:
                value: {provider: GOOGLE, idToken: example-google-token}
              apple:
                value: {provider: APPLE, idToken: example-apple-token, authorizationCode: example-code, attemptId: example-attempt}
      responses:
        '200':
          description: 소셜 인증 검증 완료. result에 따라 로그인과 가입을 구분한다.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoggedIn'
                  - $ref: '#/components/schemas/SignupRequired'
                discriminator:
                  propertyName: result
                  mapping:
                    LOGGED_IN: '#/components/schemas/LoggedIn'
                    SIGNUP_REQUIRED: '#/components/schemas/SignupRequired'
              examples:
                existingMember:
                  value: {result: LOGGED_IN, accessToken: example-access-token, refreshToken: example-refresh-token, accessTokenExpiresIn: 1800}
                newMember:
                  value: {result: SIGNUP_REQUIRED, signupToken: example-signup-token, nextStep: TERMS}
                incompleteSignup:
                  value: {result: SIGNUP_REQUIRED, signupToken: example-signup-token, nextStep: PROFILE}
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: 소셜 인증 검증 실패. 앱에서 인증을 다시 시작할 수 있다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: SOCIAL_AUTH_FAILED}
        '403':
          description: 이용 제한 상태. 일반 서비스용 토큰 없이 ADMIN-003 안내 화면으로 이동한다.
          content:
            application/json:
              schema:
                type: object
                required: [code, restrictionType]
                properties:
                  code: {type: string, enum: [ACCOUNT_RESTRICTED]}
                  restrictionType:
                    type: string
                    enum: [TEMPORARY_RESTRICTION, SUSPENSION, PERMANENT_SUSPENSION]
              examples:
                investigation:
                  summary: 조사 중 임시 제한의 중립적 안내
                  value: {code: ACCOUNT_RESTRICTED, restrictionType: TEMPORARY_RESTRICTION}
                suspension:
                  value: {code: ACCOUNT_RESTRICTED, restrictionType: SUSPENSION}
                permanentSuspension:
                  value: {code: ACCOUNT_RESTRICTED, restrictionType: PERMANENT_SUSPENSION}
        '501':
          description: 현재 구현 범위에 포함되지 않은 제공자 또는 연결된 회원의 후속 처리. 응답 본문 없음.
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  schemas:
    KakaoLogin:
      type: object
      required: [provider, idToken, attemptId]
      properties:
        provider: {type: string, enum: [KAKAO]}
        idToken: {type: string, pattern: '\S', description: 카카오 OIDC ID 토큰}
        attemptId: {type: string, pattern: '\S'}
    GoogleLogin:
      type: object
      required: [provider, idToken]
      properties:
        provider: {type: string, enum: [GOOGLE]}
        idToken: {type: string, pattern: '\S', description: 두밋 서버용 클라이언트 ID가 대상으로 지정된 Google ID 토큰}
    AppleLogin:
      type: object
      description: iOS 네이티브 로그인 기준. Android·웹 Apple 로그인은 별도 흐름으로 정한다.
      required: [provider, idToken, authorizationCode, attemptId]
      properties:
        provider: {type: string, enum: [APPLE]}
        idToken: {type: string, pattern: '\S', description: Apple SDK에서 받은 identityToken}
        authorizationCode: {type: string, pattern: '\S', description: 서버가 Apple에 교환할 일회용 인가 코드}
        attemptId: {type: string, pattern: '\S'}
    LoggedIn:
      type: object
      required: [result, accessToken, refreshToken, accessTokenExpiresIn]
      properties:
        result: {type: string, enum: [LOGGED_IN]}
        accessToken: {type: string, minLength: 1, description: 두밋 API 호출용 토큰}
        refreshToken: {type: string, minLength: 1, description: 두밋 세션 갱신용 토큰. 앱은 OS 보안 저장소에 보관한다.}
        accessTokenExpiresIn: {type: integer, enum: [1800], description: Access Token 유효기간(초)}
    SignupRequired:
      type: object
      required: [result, signupToken, nextStep]
      properties:
        result: {type: string, enum: [SIGNUP_REQUIRED]}
        signupToken:
          type: string
          minLength: 1
          description: |
            발급 후 15분 동안 유효한 AUTH-001 가입 전용 서명 토큰이다.
            후속 AUTH-001 요청의 Authorization 헤더에 Bearer 토큰으로 전달한다.
            만료되면 Google 인증을 다시 거쳐 새 가입 토큰을 발급받는다.
        nextStep:
          type: string
          enum: [TERMS, IDENTITY_VERIFICATION, PROFILE]
          description: 이어서 진행할 가입 단계. 신규 회원은 TERMS에서 시작한다.
    Error:
      type: object
      required: [code]
      properties:
        code:
          type: string
          enum: [INVALID_REQUEST, SOCIAL_AUTH_FAILED, AUTH_UNAVAILABLE]
  responses:
    InvalidRequest:
      description: JSON을 읽을 수 없거나 필수 입력값이 잘못됐다. 사용자 인증 취소는 앱에서 처리한다.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: INVALID_REQUEST}
    Unavailable:
      description: 서버가 제공자 또는 저장소에 연결할 수 없어 로그인 처리를 완료하지 못했다.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: AUTH_UNAVAILABLE}
