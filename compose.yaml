services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: domeet
      POSTGRES_USER: domeet
      POSTGRES_PASSWORD: "${DOMEET_DB_PASSWORD:?Set DOMEET_DB_PASSWORD first}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: